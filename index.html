<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل درجات الطلاب - ثانوية الأذكياء للمتفوقين</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 25px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 10px;
            border: 1px solid #e0e0e0;
            text-align: center;
        }
        th {
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .loading, .error {
            padding: 15px;
            color: #7f8c8d;
        }
        .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>سجل درجات الطلاب - ثانوية الأذكياء للمتفوقين</h2>
    <div id="content">
        <p class="loading">جاري تحميل البيانات من قاعدة البيانات...</p>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1zUkp45CxmQa9P1_fKVHNd8_O_k1jJgVgOaUvu1l3_zA/gviz/tq?tqx=out:json';

    async function fetchData() {
        try {
            const response = await fetch(SHEET_URL);
            const text = await response.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;

            if (!rows || rows.length === 0) {
                document.getElementById('content').innerHTML = '<p class="error">لا توجد بيانات حالياً في الجدول.</p>';
                return;
            }

            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>اسم الطالب</th>
                            <th>الصف والشعبة</th>
                            <th>المادة</th>
                            <th>الدرجة</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            rows.forEach((row, index) => {
                if (index === 0) return; // تخطي صف العناوين

                const studentName = row.c[0] ? row.c[0].v : '';
                const studentClass = row.c[1] ? row.c[1].v : '';
                const subject = row.c[2] ? row.c[2].v : '';
                const score = row.c[3] ? row.c[3].v : '';

                if (studentName) {
                    tableHTML += `
                        <tr>
                            <td>${studentName}</td>
                            <td>${studentClass}</td>
                            <td>${subject}</td>
                            <td>${score}</td>
                        </tr>
                    `;
                }
            });

            tableHTML += '</tbody></table>';
            document.getElementById('content').innerHTML = tableHTML;

        } catch (error) {
            console.error(error);
            document.getElementById('content').innerHTML = '<p class="error">حدث خطأ أثناء تحميل البيانات. تأكد من إعدادات مشاركة الجدول.</p>';
        }
    }

    fetchData();
</script>

</body>
</html>
