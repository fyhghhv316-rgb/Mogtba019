<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثانوية الأذكياء للمتفوقين - إدارة الدرجات</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #7f8c8d;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>سجل درجات الطلاب - ثانوية الأذكياء للمتفوقين</h2>
    
    <div id="loading" class="loading">جاري تحميل البيانات من قاعدة البيانات...</div>
    
    <table id="gradesTable" style="display: none;">
        <thead>
            <tr>
                <th>اسم الطالب</th>
                <th>الصف والشعبة</th>
                <th>المادة</th>
                <th>الدرجة</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- البيانات ستعرض هنا تلقائياً -->
        </tbody>
    </table>
</div>

<script>
    // رابط جدول البيانات التجريبي الخاص بك
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1zUkp45CxmQa9P1_fKVHNd8_O_k1jJgVgOaUvu1l3_zA/gviz/tq?tqx=out:json";

    fetch(sheetUrl)
        .then(res => res.text())
        .then(rep => {
            // معالجة البيانات القادمة من جوجل شيت
            const data = JSON.parse(rep.substr(47).slice(0, -2));
            const rows = data.table.rows;
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            // التخطي عن صف العناوين والبدء بالبيانات
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i].c;
                if (row && row[0]) {
                    const name = row[0] ? row[0].v : '';
                    const gradeClass = row[1] ? row[1].v : '';
                    const subject = row[2] ? row[2].v : '';
                    const score = row[3] ? row[3].v : '';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${name}</td>
                        <td>${gradeClass}</td>
                        <td>${subject}</td>
                        <td>${score}</td>
                    `;
                    tbody.appendChild(tr);
                }
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('gradesTable').style.display = 'table';
        })
        .catch(err => {
            document.getElementById('loading').innerText = "حدث خطأ أثناء تحميل البيانات. تأكد من إعدادات الجدول.";
            console.error(err);
        });
</script>

</body>
</html>
